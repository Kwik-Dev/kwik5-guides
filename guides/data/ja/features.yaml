# Structure mirrors data/en/features.yaml; comments there are the source of truth.

steps:
- title: Photoshopで描く
  body: ページはPSDファイルで、レイヤーごとにグループ化されています。新しいツールの学習や、複雑なエクスポート手順は不要です。
- title: Kwik Exporterから公開
  body: UXPプラグインは、レイヤーグループをページに変換し、 bleed（余白）とオーバーキャンを設定して、ページツリーを書き出します。
- title: Solar2Dで構築
  body: シミュレーターで実行するか、iOS、Android、デスクトップ向けにビルドできます。同じアートで4つの画面。
  points:
  - ランタイムプラグインには、Kwikのエディターが同梱されています。ブックおよびページへのナビゲーション、および表示中のページを手動で編集する機能が含まれます。
  - kwik-CLIを通じて動作するため、AIエージェントがアニメーション、トランジション、インタラクション、ページロジックなど、通常クリックで実行する操作をコマンドで実行できます。
features:
- title: Retina対応の書き出し
  body: あらゆるデバイスで、アートワークは常に鮮明に。ソースとなるPSDは1つで、追加の素材セットは不要です。
- title: 音声とテキストの同期
  body: アートと同じページツリーで駆動される、ページごとのナレーションと単語ハイライト。
- title: アプリ内購入
  body: Solar2Dプラグインを、追加のコードベースなしで、そのまま接続。
- title: Luaは、必要なときに
  body: デザイナーがクリックする必要のない部分には、スクリプトによるページ生成とエディタサーバーを提供します。
- title: 2つのエディタ画面
  body: Kwik Exporter 用の Photoshop 内 UXP、およびブックのランタイム動作には Lua を使用しています。
- title: 無料・オープンソース
  body: エクスポート機能、エディター、ランタイムはすべてオープンソースです。ライセンスの制限も、サーバーへの通信（フォーンホーム）もありません。
