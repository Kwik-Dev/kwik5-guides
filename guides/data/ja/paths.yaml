# Structure mirrors data/en/paths.yaml; comments there are the source of truth.

lede: KwikではGPUは不要であり、生成されたアートも必要ありません。クラウドアカウントなしで、Photoshopだけでブックを制作することも可能です。
paths:
- title: Photoshopで描く
  tag: 常に無料
  body: ページはPSDファイルで、レイヤーごとにグループ化されています。手描き、インク、スキャン、撮影、あるいはPhotoshopのAI機能（ジェネレーティブフィル、ジェネレーティブエクスパンドなど）で組み立てたものでも構いません。Kwikはファイルを読み込むだけで、ピクセルがどのように生成されたかは問いません。
  note: アカウントも、キーも、アップロードも不要。
- title: ローカルで生成
  tag: 無料、オープンソース
  body: Guaardvark — guaardvark/guaardvark のフォーク、MIT、© Albenze, Inc. — は、クラウドが使用するのと同じジョブエンベロープから、アート、ナレーション、音楽をローカルで処理します。これにより、同じページのローカルレンダリングとクラウドレンダリングの結果を比較可能にします。コマンドは
    kwik setup で、バックエンドをネイティブまたは Docker でインストールします。
  note: ご自身のGPUが必要です。データはマシン外に送信されません。
- title: クラウドGPUを使用する
  tag: 任意、従量課金
  body: クラウドは必須ではなく、選択肢です。モデルを動作できないノートPC、動画の多いページ、Cast LoRA に対応します。課金単位はクレジットで、無断で処理が開始されることはありません。費用が発生するジョブは、実行前に価格を明示します。
  note: 1人あたり1回のみ、30クレジットを無料提供（D16）。
