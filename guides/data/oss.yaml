# What is open source. Source of truth: docs/decisions.md D2 and
# docs/kwik-cloud-plan.md §1 ("what is OSS, what is the product").
#
# Only the hosted GPU endpoints, the credit ledger and the Cast LoRA store are
# proprietary (D3). Everything listed here is MIT/Apache and self-hostable.

lede: >-
  Everything you run on your own machine is open source — MIT or Apache-2.0, no licence key,
  no phone-home (D2). The only thing sold is GPU time you do not have.

components:
  - name: kwik5-exporter
    artifact: .ccx
    role: The Photoshop panel that turns layer groups into pages, sets bleed and overscan, and writes the page tree.
  - name: kwik5-CLI
    artifact: kwik
    role: The whole pipeline without Photoshop or Python — upscale, bleed crop, layered page.psd, Lua, the md5 asset gate, the ogv transcode (D18).
  - name: kwik5-plugin
    artifact: runtime
    role: The Solar2D runtime plugin your book runs on, at build time and at play time.
  - name: kwik5-project-template
    artifact: template
    role: The skeleton a new book starts from — Solar2D config, build settings, the page tree wire format.
  - name: guaardvark
    artifact: local backend
    role: The local generation stack (its own GPU server + ComfyUI). Art, narration and music on your own machine, free and offline.
  - name: kwik5-sample-books
    artifact: books
    role: Sample books, including biscuit-comes-home — the book the proof strip above is made from.

footnote: >-
  Self-host the whole thing and you owe nothing. The paid part is the queue, the models and
  the GPUs behind the cloud tools, which is the one piece a laptop cannot fake.
