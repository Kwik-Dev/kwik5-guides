# kwiksher.com — the landing page and the manual, one Hugo build
#
#   /                 landing page          (this repo's guides/)
#   /guides/          the manual, mounted from docs/guides/*.md (never copied)
#   /about/ /credits/ /privacy/
#
# Two publish targets, one source tree, and the only difference is --baseURL (deploy/site.sh):
#   cloud-sandbox   https://kwiksher.com/cloud-sandbox/   stage Worker, Polar sandbox, gated
#   cloud           https://kwiksher.com/cloud/           production (not published yet)
#
# TOP-LEVEL KEYS FIRST. In TOML a bare key after a table header belongs to that table, so
# `disableKinds` written below [languages.ja.params] silently configures the Japanese params map and
# the taxonomy pages come back. Everything that is not a table lives above the first [header].

baseURL = 'https://kwiksher.com/cloud/'
title = 'Kwik'
enableRobotsTXT = true
disableKinds = ['taxonomy', 'term']

# Multilingual, and the one line that must not change later: English stays at the URLs that already
# exist (/, /about/, /credits/, /guides/), Japanese lives beside it at /ja/. Flip this and every
# published URL moves, including the credits page a Worker 402 points at.
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false

[languages.en]
  label = 'English'
  locale = 'en-US'
  weight = 1

  [languages.en.params]
    switchLabel = '日本語'

[languages.ja]
  label = '日本語'
  locale = 'ja-JP'
  weight = 2

  [languages.ja.params]
    switchLabel = 'English'

[build]
  writeStats = false

[markup]
  [markup.goldmark.renderer]
    unsafe = false
  [markup.highlight]
    style = 'github'
    lineNos = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[params]
  # Translatable prose lives in i18n/*.yaml (hero.title, seo.description) so that a param can never
  # be the English string in the Japanese build; see guides/README.md.
  githubURL = 'https://github.com/kwik-dev'
  archiveURL = 'https://archive.kwiksher.com/'
  # The Polar checkout button ships with the Astro landing page; until then the landing CTA points
  # at the guides, which are real.
  checkoutURL = ''
  # 'sandbox' or 'production'. Load-bearing: the /cloud-sandbox/ build relies on it to hand out links
  # that cannot charge a card. See docs/polar-sandbox-testing.md.
  polarMode = 'sandbox'
  preview = true

[module]
  # Mounts are per language: content/en and content/ja are separate trees, and the manual exists in
  # English only. Without the restriction a mount lands in every language and Japanese readers get
  # English text at /ja/guides/.
  [[module.mounts]]
    source = 'content/en'
    target = 'content'
    [module.mounts.sites.matrix]
      languages = ['en']

  [[module.mounts]]
    source = 'content/ja'
    target = 'content'
    [module.mounts.sites.matrix]
      languages = ['ja']

  # The manual, mounted from the planning repo so editing it edits the site.
  [[module.mounts]]
    source = '../docs/guides'
    target = 'content/guides'
    # guides are numbered NN-name.md; README.md is the repo's index, not a page.
    files = ['[0-9][0-9]-*.md']
    [module.mounts.sites.matrix]
      languages = ['en']

  [[module.mounts]]
    source = 'data'
    target = 'data'

  [[module.mounts]]
    source = 'layouts'
    target = 'layouts'

  [[module.mounts]]
    source = 'assets'
    target = 'assets'

  [[module.mounts]]
    source = 'static'
    target = 'static'
