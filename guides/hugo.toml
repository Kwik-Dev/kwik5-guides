# kwiksher.com
#
# Two surfaces, one static output:
#   /            the landing page (this project, for now)
#   /guides/     the manual, rendered from docs/guides/*.md
#
# Long term docs/new-site-plan.md wants the landing page in Astro (`site/`) and
# Hugo to own only /guides/. This project builds both so the whole site can be
# reviewed and deployed from one command; the split is a copy step, not a rewrite.
#
#   hugo            → public/      (serve at the domain root)
#   hugo server     → http://localhost:1313/

# The site lives under /cloud/ on the existing WordPress host: a real directory in public_html
# takes precedence over WordPress's rewrite, so /cloud/ and /cloud/credits/ are ours while
# / , /about-us/ , /blog/ … stay WordPress. Local `hugo server` keeps the path too, so dev and
# production agree (`http://localhost:1313/cloud/`).
baseURL = 'https://kwiksher.com/cloud/'
title = 'Kwik'
locale = 'en'
defaultContentLanguage = 'en'
enableRobotsTXT = true

disableKinds = ['taxonomy', 'term']

[build]
  writeStats = false

[markup]
  [markup.goldmark.renderer]
    unsafe = false
  [markup.highlight]
    style = 'github'
    lineNos = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[params]
  tagline = 'Your PSD is the project. Draw it, generate it, refine it.'
  description = 'Kwik reads a layered PSD — hand-drawn, or AI-generated and then refined — and turns it into an interactive storybook or game for iOS, Android and desktop. Every layer stays yours to change.'
  githubURL = 'https://github.com/kwik-dev'
  archiveURL = 'https://archive.kwiksher.com/'
  # The Polar checkout button ships with the Astro landing page; until then the
  # landing CTA points at the guides, which are real.
  checkoutURL = ''
  # 'sandbox' or 'production'. The sandbox is a separate Polar server with its
  # own org, products, tokens and test cards — see docs/polar-sandbox-testing.md
  #
  # This is global and it is load-bearing: the /cloud-sandbox/ build relies on it to hand out
  # links that cannot charge a card. Publishing /cloud/ for real money therefore needs a
  # `--params polarMode=production` build, not just this default. deploy/site.sh cloud warns
  # when it sees sandbox links in a production build.
  polarMode = 'sandbox'
  preview = true

# The manual. docs/guides/*.md are mounted, never copied: editing the planning
# repo edits this site.
[module]
  [[module.mounts]]
    source = '../docs/guides'
    target = 'content/guides'
    # guides are numbered NN-name.md; README.md is the repo's index, not a page.
    # (`excludeFiles` is deprecated and `!README.md` negation is not honoured here.)
    files = ['[0-9][0-9]-*.md']
  [[module.mounts]]
    source = 'content'
    target = 'content'
  [[module.mounts]]
    source = 'data'
    target = 'data'
  [[module.mounts]]
    source = 'layouts'
    target = 'layouts'
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = 'static'
    target = 'static'
