credits.packs_note: >-
  The packs above are placeholders until a Polar checkout link exists for each one. Prices come
  from D13 (1 credit = $0.10); nothing here is charged until a checkout link is configured.
credits.already_bought: Already bought credits?
credits.step1_title: Find your key
credits.step1_body_html: >-
  Your licence key <em>is</em> your account — there is no password. Polar holds it for you:
  <a href="{{ .portal }}" rel="noopener">open the {{ .mode }} customer portal</a> and ask for a
  sign-in link by email.
credits.step2_title: Sign in from the terminal
credits.step2_body_html: >-
  Paste the key when prompted, or pipe it in: <code>kwik cloud login --key-stdin</code>. Then
  <code>kwik cloud credits</code> shows your balance and <code>kwik cloud status</code> the
  endpoint you are talking to.
credits.api_note_html: >-
  Balance and job history are read with the key against the API. A browser view of the same
  numbers is not built yet: the Worker sends no CORS headers, so a page on this domain cannot call
  it. See <a href="{{ .issues }}" rel="noopener">the issue tracker</a>.
