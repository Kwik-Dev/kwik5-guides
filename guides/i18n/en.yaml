# Landing-page interface strings.
#
# Everything a reader sees that is not content (front matter/markdown) and not data
# (features, faq, pricing …) lives here, so a translation is a YAML file, not a template edit.
# Templates call these with {{ i18n "key" }}; a missing key renders the key name, which is why
# translate/check.py fails the build on key-set mismatch.
#
# Values containing markup end in `_html` and are rendered with `| safeHTML`. Keep the markup
# minimal — it is here for emphasis and inline <code>, not layout.

