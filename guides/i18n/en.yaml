seo.description: >-
  Kwik reads a layered PSD — hand-drawn, or AI-generated and then refined — and turns it into an
  interactive storybook or game for iOS, Android and desktop. Every layer stays yours to change.

hero.eyebrow: Layered PSD → Solar2D
hero.title: Your PSD is the project. Draw it, generate it, refine it.
hero.sub: >-
  Kwik Exporter — a free UXP plugin for Photoshop — and a Solar2D editor for interactive
  storybooks and games. Layers become pages, and pages run on Solar2D — iOS, Android and desktop.
  Hand-draw the art, generate it, or take a model's draft and fix it — either way it lands in a
  layered PSD, and every layer stays yours to change. The cloud GPU is an option, never a
  requirement.
