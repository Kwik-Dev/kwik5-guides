credits.sandbox_strip_html: "<strong>サンドボックス。</strong>これらはPolarのサンドボックスサーバー上のテスト用製品です。テスト用カード番号は<code>4242 4242 4242 4242</code>、有効期限は任意の未来の日付で構いません。決済は発生せず、ここで購入したクレジットは本番環境では存在しません。"
credits.pick_pack: "パックを選択"
credits.buy: "{{ .name }}を購入する"
credits.not_on_sale: "現在、販売は開始していません。"
credits.packs_note: "上記のパックは、各パックにPolarのチェックアウトリンクが設定されるまでのプレースホルダーです。価格はD13から取得されます（1クレジット = 0.10ドル）。チェックアウトリンクが設定されるまでは、ここでは一切の課金は発生しません。"
credits.already_bought: "すでにクレジットを購入済みですか？"
credits.step1_title: "キーをお探しください"
credits.step1_body_html: "ライセンスキー<em>が</em>そのままアカウントです。パスワードは不要です。Polarが管理していますので、<a href=\"{{ .portal }}\" rel=\"noopener\">{{ .mode }}カスタマーポータルを開く</a>と、メールでサインインリンクをお送りします。"
credits.step2_title: "ターミナルからサインイン"
credits.step2_body_html: "プロンプトが表示された際にキーを貼り付け、またはパイプで入力します: <code>kwik cloud login --key-stdin</code>。その後、<code>kwik cloud credits</code> で残高を確認でき、<code>kwik cloud status</code> で接続先エンドポイントを確認できます。"
credits.api_note_html: "残高と取引履歴は、API に対してキーを提示して読み取ります。同じ数値をブラウザで表示する機能はまだ実装されていません。Worker が CORS ヘッダーを送信しないため、このドメイン上のページから呼び出すことができないためです。詳細は<a href=\"{{ .issues }}\" rel=\"noopener\">イシュートラッカー</a>を参照してください。"
