seo.description: "Kwikは、手描きまたはAI生成後に調整された多層のPSDを読み取り、iOS、Android、デスクトップ向けのインタラクティブな絵本やゲームに変換します。すべてのレイヤーは、引き続きご自身で編集・変更が可能です。"
hero.eyebrow: "レイヤー付きPSD → Solar2D"
hero.title: "PSDファイルがプロジェクトです。描き、生成し、洗練させてください。"
hero.sub: "Kwik Exporter（Photoshop用の無料UXPプラグイン）と、インタラクティブな絵本やゲーム向けのSolar2Dエディター。レイヤーがページになり、そのページがSolar2D上で動作します。iOS、Android、デスクトップ対応。アートを手描きで制作しても、生成しても、モデルの草案を修正しても、いずれもレイヤー付きのPSDとして出力され、すべてのレイヤーは自由に編集可能です。クラウドGPUは任意のオプションであり、必須ではありません。"
