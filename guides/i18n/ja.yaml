preview.strip_html: "<strong>構成プレビュー。</strong>ランディングページの文言は下書き、実績紹介とお客様の声はプレースホルダー、PolarのチェックアウトボタンはAstroビルド時に追加されます。ガイドは実装済みです。"
proof.note_html: "1つのブックから4つの成果物——表紙、1ページに収めた登場人物、最初のスプライトバッチ、そして1ページ用にレンダリングされた1.6秒のクリップ。これらはすべて<code>biscuit-comes-home</code>に含まれています。"
