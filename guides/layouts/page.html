{{ define "main" }}
<article class="page-head">
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
  <p class="doc-meta">
    {{ with .Params.updated }}<span class="muted">updated {{ . }}</span>{{ end }}
  </p>
</article>

<div class="page-layout">
  {{ with .TableOfContents }}
    {{ if gt (len .) 100 }}
      <nav class="toc page-toc" aria-label="On this page">
        <p class="toc-title">On this page</p>
        {{ . }}
      </nav>
    {{ end }}
  {{ end }}
  <div class="page-body doc-body">{{ .Content }}</div>
</div>
{{ end }}
